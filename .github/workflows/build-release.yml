name: Build and Release (native + OpenSSL fix)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-native:
    name: Build native artifacts
    runs-on: ubuntu-latest
    env:
      TERM: xterm-256color
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure git submodules initialized and synced
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Install system packages (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl wget curl unzip git ca-certificates
          sudo apt-get install -y libssl-dev zlib1g-dev libbz2-dev liblzma-dev dos2unix

      - name: Detect local OpenSSL submodule
        id: detect_openssl
        run: |
          if [ -d "third_party/openssl" ] || [ -d "openssl" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            if [ -d "third_party/openssl" ]; then
              echo "path=third_party/openssl" >> $GITHUB_OUTPUT
            else
              echo "path=openssl" >> $GITHUB_OUTPUT
            fi
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "path=" >> $GITHUB_OUTPUT
          fi

      - name: Make build scripts executable and normalize line endings
        run: |
          echo "Fixing permissions and normalizing line endings for scripts"
          # Make common script files executable
          chmod +x scripts/*.sh || true
          chmod +x scripts/**.sh || true
          # Normalize CRLF to LF for shell scripts
          if command -v dos2unix >/dev/null 2>&1; then
            dos2unix scripts/*.sh || true
            dos2unix scripts/**.sh || true
          else
            sed -i 's/\r$//' scripts/*.sh || true
            sed -i 's/\r$//' scripts/**.sh || true
          fi
          ls -la scripts || true

      - name: Debug script metadata
        run: |
          echo "Permissions and first line of scripts:"
          for f in scripts/*.sh; do
            echo "---- $f ----"
            ls -l "$f" || true
            head -n 1 "$f" | sed -n '1p' || true
          done

      - name: Build OpenSSL from source (local submodule)
        if: steps.detect_openssl.outputs.found == 'true'
        run: |
          set -euo pipefail
          OPENSSL_DIR="${{ steps.detect_openssl.outputs.path }}"
          echo "Building OpenSSL from ${OPENSSL_DIR}"
          pushd "$OPENSSL_DIR"
          # Adjust Configure options as needed (remove no-shared if you need shared libs)
          ./Configure linux-x86_64 no-shared --prefix="$(pwd)/openssl-install"
          make -j$(nproc)
          make install_sw
          popd
          # Export environment variables for downstream steps
          echo "OPENSSL_ROOT=$(pwd)/${OPENSSL_DIR}/openssl-install" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(pwd)/${OPENSSL_DIR}/openssl-install/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(pwd)/${OPENSSL_DIR}/openssl-install/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Configure PKG_CONFIG_PATH for system OpenSSL
        if: steps.detect_openssl.outputs.found == 'false'
        run: |
          echo "Using system OpenSSL (libssl-dev)"
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Show OpenSSL and environment info
        run: |
          echo "Which openssl:"
          command -v openssl || true
          echo "OpenSSL version:"
          openssl version || true
          echo "pkg-config openssl:"
          pkg-config --modversion openssl || true
          echo "Environment snapshot (filtered):"
          echo "TERM=${TERM:-}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"
          echo "OPENSSL_ROOT=${OPENSSL_ROOT:-}"

      - name: Run repository native build
        env:
          TERM: xterm-256color
        run: |
          set -euo pipefail
          echo "CI debug: show a few environment vars"
          echo "TERM=${TERM:-}"
          echo "OPENSSL_ROOT=${OPENSSL_ROOT:-}"
          # Safe tput check (non-fatal)
          if command -v tput >/dev/null 2>&1 && [ -n "${TERM:-}" ]; then
            tput colors 2>/dev/null || echo "tput exists but returned non-zero"
          else
            echo "tput not available or TERM unset; continuing without terminal control"
          fi
          # Ensure read-property.sh is runnable; if not, run via bash to avoid permission issues
          if [ -f "scripts/read-property.sh" ]; then
            if [ -x "scripts/read-property.sh" ]; then
              scripts/read-property.sh || true
            else
              bash scripts/read-property.sh || true
            fi
          fi
          # Run setup script if present (use bash to avoid permission problems)
          if [ -f "scripts/setup.sh" ]; then
            bash scripts/setup.sh
          fi
          # Replace the following with your actual build commands
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            # Example CMake flow (uncomment and adapt if you use CMake)
            # cmake -S . -B build -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT:-/usr}"
            # cmake --build build -- -j$(nproc)
            echo "No gradle wrapper found; run your native build commands here."
          fi

      - name: Run tests (optional)
        if: always()
        run: |
          echo "No tests configured by default. Add test commands here if needed."

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/**
            app/build/outputs/**/*.apk
            *.apk
            *.a
            *.so
            *.zip

  build-android:
    name: Build Android artifacts
    runs-on: ubuntu-latest
    needs: build-native
    env:
      TERM: xterm-256color
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure Android scripts are executable and normalized
        run: |
          chmod +x scripts/*.sh || true
          sed -i 's/\r$//' scripts/*.sh || true
          ls -la scripts || true

      - name: Setup Android NDK and SDK placeholder
        run: |
          echo "Add Android SDK/NDK setup steps here if you build Android artifacts."
          # Example: install sdkmanager, accept licenses, download NDK, set ANDROID_NDK_HOME

      - name: Build Android (placeholder)
        run: |
          set -euo pipefail
          echo "Ensure OpenSSL for Android is built with the NDK toolchain if required."
          # Insert Android build commands here, e.g.:
          # ./gradlew assembleRelease -Pandroid.ndkPath=$ANDROID_NDK_HOME
          echo "Android build steps go here."

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            app/build/outputs/**/*.apk
            *.a
            *.so
