name: Build and Release (native + OpenSSL + Android latest NDK)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TERM: xterm-256color
  PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl wget curl unzip git ca-certificates dos2unix
          sudo apt-get install -y libssl-dev zlib1g-dev libbz2-dev liblzma-dev

      - name: Normalize line endings and make scripts executable
        run: |
          find scripts -type f -name "*.sh" -exec sed -i 's/\r$//' {} \;
          find scripts -type f -name "*.sh" -exec chmod +x {} \;
          ls -la scripts
          ls -la scripts/private || true

      - name: Run setup safely
        run: |
          set -euo pipefail
          # Run private patch script via bash to avoid permission issues
          if [ -f "scripts/private/patch-opus-impl.sh" ]; then
            bash scripts/private/patch-opus-impl.sh || true
          fi
          # Run setup script
          if [ -f "scripts/setup.sh" ]; then
            bash scripts/setup.sh
          fi
          # Build commands
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "No gradle wrapper found; run your native build commands here."
          fi

      - name: Upload native artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-artifacts
          path: |
            build/**
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab

  build-android:
    runs-on: ubuntu-latest
    needs: build-native
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Android SDK tools
        run: |
          sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          sudo chown -R $USER:$USER $ANDROID_SDK_ROOT
          cd /tmp
          curl -sSfLo commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          unzip -q commandlinetools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses

      - name: Install latest Android NDK + build-tools
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Run Android build
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease -Pandroid.ndkPath="${ANDROID_NDK_HOME:-}" --no-daemon
          else
            echo "No gradle wrapper found; run Android build commands here."
          fi

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
