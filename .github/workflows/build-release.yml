name: Build and Release (native + OpenSSL + Android fixes)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # global defaults
  TERM: xterm-256color
  PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig

jobs:
  build-native:
    name: Build native artifacts
    runs-on: ubuntu-latest
    env:
      TERM: xterm-256color
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure git submodules initialized and synced
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Install system packages (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl wget curl unzip git ca-certificates dos2unix
          sudo apt-get install -y libssl-dev zlib1g-dev libbz2-dev liblzma-dev

      - name: Normalize line endings and make scripts executable (including private)
        run: |
          echo "Normalize CRLF -> LF and set execute bit for scripts"
          # normalize and chmod for top-level scripts
          if [ -d scripts ]; then
            find scripts -type f -name "*.sh" -print0 | xargs -0 -r sed -i 's/\r$//' || true
            find scripts -type f -name "*.sh" -print0 | xargs -0 -r chmod +x || true
          fi
          # also handle scripts/private if present
          if [ -d scripts/private ]; then
            find scripts/private -type f -name "*.sh" -print0 | xargs -0 -r sed -i 's/\r$//' || true
            find scripts/private -type f -name "*.sh" -print0 | xargs -0 -r chmod +x || true
          fi
          ls -la scripts || true
          ls -la scripts/private || true

      - name: Debug script metadata
        run: |
          echo "Permissions and shebangs for scripts:"
          for f in scripts/*.sh scripts/private/*.sh; do
            [ -f "$f" ] || continue
            echo "---- $f ----"
            ls -l "$f"
            head -n 1 "$f" || true
          done

      - name: Detect local OpenSSL submodule
        id: detect_openssl
        run: |
          if [ -d "third_party/openssl" ] || [ -d "openssl" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            if [ -d "third_party/openssl" ]; then
              echo "path=third_party/openssl" >> $GITHUB_OUTPUT
            else
              echo "path=openssl" >> $GITHUB_OUTPUT
            fi
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "path=" >> $GITHUB_OUTPUT
          fi

      - name: Build OpenSSL from source (local submodule)
        if: steps.detect_openssl.outputs.found == 'true'
        run: |
          set -euo pipefail
          OPENSSL_DIR="${{ steps.detect_openssl.outputs.path }}"
          echo "Building OpenSSL from ${OPENSSL_DIR}"
          pushd "$OPENSSL_DIR"
          ./Configure linux-x86_64 no-shared --prefix="$(pwd)/openssl-install"
          make -j$(nproc)
          make install_sw
          popd
          echo "OPENSSL_ROOT=$(pwd)/${OPENSSL_DIR}/openssl-install" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(pwd)/${OPENSSL_DIR}/openssl-install/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(pwd)/${OPENSSL_DIR}/openssl-install/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Configure PKG_CONFIG_PATH for system OpenSSL
        if: steps.detect_openssl.outputs.found == 'false'
        run: |
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Show OpenSSL and environment info
        run: |
          command -v openssl || true
          openssl version || true
          pkg-config --modversion openssl || true
          echo "TERM=${TERM:-}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"
          echo "OPENSSL_ROOT=${OPENSSL_ROOT:-}"

      - name: Run repository native build (safe)
        env:
          TERM: xterm-256color
        run: |
          set -euo pipefail
          echo "CI debug: TERM=${TERM:-}, OPENSSL_ROOT=${OPENSSL_ROOT:-}"
          # Safe tput usage
          if command -v tput >/dev/null 2>&1 && [ -n "${TERM:-}" ]; then
            tput colors 2>/dev/null || echo "tput returned non-zero"
          else
            echo "tput not available or TERM unset"
          fi
          # If read-property.sh exists, run via bash to avoid permission issues
          if [ -f "scripts/read-property.sh" ]; then
            echo "Running scripts/read-property.sh via bash"
            bash scripts/read-property.sh || true
          fi
          # If private patch script exists, run via bash (avoid permission problems)
          if [ -f "scripts/private/patch-opus-impl.sh" ]; then
            echo "Running scripts/private/patch-opus-impl.sh via bash"
            bash scripts/private/patch-opus-impl.sh || true
          fi
          # Run setup script via bash
          if [ -f "scripts/setup.sh" ]; then
            bash scripts/setup.sh
          fi
          # Replace with your actual build commands
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "No gradle wrapper found; run your native build commands here."
          fi

      - name: Upload build artifacts (only if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/**
            app/build/outputs/**/*.apk
            *.apk
            *.a
            *.so
            *.zip
          # allow-no-files is not a direct input for upload-artifact v4; we handle missing files by checking before upload
      - name: List artifact candidates (debug)
        if: always()
        run: |
          echo "Listing possible artifact files:"
          ls -la build || true
          ls -la app/build/outputs || true
          ls -la *.apk *.a *.so *.zip || true

  build-android:
    name: Build Android artifacts (with NDK install)
    runs-on: ubuntu-latest
    needs: build-native
    env:
      TERM: xterm-256color
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure scripts executable and normalized (android)
        run: |
          if [ -d scripts ]; then
            find scripts -type f -name "*.sh" -print0 | xargs -0 -r sed -i 's/\r$//' || true
            find scripts -type f -name "*.sh" -print0 | xargs -0 -r chmod +x || true
          fi
          ls -la scripts || true

      - name: Install Android SDK tools (cmdline-tools) and accept licenses
        run: |
          set -euo pipefail
          sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          sudo chown -R $USER:$USER $ANDROID_SDK_ROOT
          # Install command-line tools if missing
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            cd /tmp
            curl -sSfLo commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
            unzip -q commandlinetools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --list || true

      - name: Install specific Android NDK (23.2.8568313) and build-tools
        run: |
          set -euo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          # Install the exact NDK version required
          sdkmanager "ndk;23.2.8568313" || true
          # Verify installation
          if [ -d "$ANDROID_SDK_ROOT/ndk/23.2.8568313" ]; then
            echo "NDK installed"
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> $GITHUB_ENV
            echo "PATH=$ANDROID_SDK_ROOT/ndk/23.2.8568313:$PATH" >> $GITHUB_ENV
          else
            echo "NDK 23.2.8568313 not found after sdkmanager; listing ndk dir:"
            ls -la $ANDROID_SDK_ROOT/ndk || true
            # Fail the job explicitly so user sees the problem
            exit 1
          fi

      - name: Show Android SDK/NDK info
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          ls -la $ANDROID_SDK_ROOT || true
          ls -la $ANDROID_SDK_ROOT/ndk || true

      - name: Run Android build (safe)
        env:
          TERM: xterm-256color
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          echo "CI debug: TERM=${TERM:-}, ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          # Run any private patch scripts safely via bash
          if [ -f "scripts/private/patch-opus-impl.sh" ]; then
            bash scripts/private/patch-opus-impl.sh || true
          fi
          # Run gradle build (example)
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease -Pandroid.ndkPath="${ANDROID_NDK_HOME:-}" --no-daemon
          else
            echo "No gradle wrapper found; run Android build commands here."
          fi

      - name: Upload Android artifacts (only if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            app/build/outputs/**/*.apk
            *.a
            *.so
