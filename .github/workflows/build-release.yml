name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release?'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dorg.gradle.caching=true
    -Dorg.gradle.daemon=false
    -Dkotlin.incremental=false

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------
      # CACHE – fresh key to avoid old broken caches
      # ------------------------------------------------------------
      - name: Cache submodules
        uses: actions/cache@v5.1.0
        with:
          path: |
            .git/modules
            tdlib
            app/jni/third_party
            thirdparty/androidx-media
            vkryl
          key: submodules-v7-${{ runner.os }}-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            submodules-v7-${{ runner.os }}-

      # ------------------------------------------------------------
      # FORCE-CLEAN and INIT submodules
      # ------------------------------------------------------------
      - name: Force-clean and init submodules
        id: submodule_init
        run: |
          # Remove any stale tdlib folder and its Git metadata so the
          # cache never serves a partially-initialized copy.
          rm -rf tdlib .git/modules/tdlib
          git submodule sync --recursive || true
          git submodule update --init --recursive --depth 1 --force || true

          # Verify that the prebuilt OpenSSL libraries shipped inside the
          # tdlib submodule are present.  The build uses these pre-compiled
          # .so files directly; it does NOT need the OpenSSL source tree.
          if [ -f "tdlib/openssl/arm64-v8a/lib/libcryptox.so" ]; then
            echo "SUCCESS: prebuilt OpenSSL libs found in tdlib/openssl/"
            echo "submodule_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: tdlib/openssl/ prebuilt libs missing – submodule init may have failed"
            echo "submodule_ok=false" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------
      # MANUAL FALLBACK – re-clone tdlib if submodule init failed
      # ------------------------------------------------------------
      - name: Manual clone of tdlib (fallback)
        if: steps.submodule_init.outputs.submodule_ok == 'false'
        run: |
          echo "Submodule init did not produce prebuilt OpenSSL – cloning tdlib manually"

          TDLIB_URL=$(git config --file .gitmodules submodule.tdlib.url)
          TDLIB_COMMIT=$(git ls-tree HEAD tdlib | awk '{print $3}')

          if [ -z "$TDLIB_URL" ] || [ -z "$TDLIB_COMMIT" ]; then
            echo "ERROR: could not determine tdlib URL or commit from .gitmodules / git ls-tree"
            exit 1
          fi
          echo "Cloning $TDLIB_URL at $TDLIB_COMMIT"

          rm -rf tdlib .git/modules/tdlib
          git clone --depth 1 "$TDLIB_URL" tdlib
          (cd tdlib && git fetch --depth 1 origin "$TDLIB_COMMIT" && git checkout "$TDLIB_COMMIT") || \
          (cd tdlib && git fetch origin && git checkout "$TDLIB_COMMIT")

          # Final verification – prebuilt libs must now exist
          if [ -f "tdlib/openssl/arm64-v8a/lib/libcryptox.so" ]; then
            echo "SUCCESS: prebuilt OpenSSL libs found after manual clone"
          else
            echo "FATAL: tdlib/openssl/ still missing after manual clone"
            echo "Contents of tdlib/:"
            ls -la tdlib/ || true
            exit 1
          fi

      # ------------------------------------------------------------
      # CONTINUE WITH THE REST OF THE BUILD
      # ------------------------------------------------------------
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read required NDK version
        id: ndk_ver
        run: |
          NDK=$(grep '^version.ndk_legacy=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "ndk_version=$NDK" >> "$GITHUB_OUTPUT"

      - name: Install NDK ${{ steps.ndk_ver.outputs.ndk_version }}
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${{ steps.ndk_ver.outputs.ndk_version }}"

      - name: Setup NDK environment for OpenSSL
        run: |
          NDK_VERSION=${{ steps.ndk_ver.outputs.ndk_version }}
          NDK_ROOT="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"

          # Add NDK toolchain to PATH so OpenSSL's Configure script can find aarch64-linux-android-gcc
          echo "${TOOLCHAIN}/bin" >> $GITHUB_PATH

          # Export environment variables for OpenSSL cross-compilation
          export ANDROID_NDK_ROOT="${NDK_ROOT}"
          export ANDROID_NDK="${NDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export PATH="${TOOLCHAIN}/bin:${PATH}"

          # Verify NDK toolchain is accessible
          echo "NDK_ROOT: ${NDK_ROOT}"
          echo "TOOLCHAIN: ${TOOLCHAIN}"
          echo "Checking aarch64-linux-android-gcc..."
          if [ -f "${TOOLCHAIN}/bin/aarch64-linux-android-gcc" ]; then
            echo "✓ NDK toolchain found at ${TOOLCHAIN}/bin"
            ${TOOLCHAIN}/bin/aarch64-linux-android-gcc --version | head -1
          else
            echo "✗ NDK toolchain NOT found – checking contents of ${TOOLCHAIN}/bin:"
            ls -la "${TOOLCHAIN}/bin" | head -20
            exit 1
          fi

          # Save environment variables for next steps (they inherit the modified $GITHUB_PATH)
          echo "ANDROID_NDK_ROOT=${NDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_NDK=${NDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV

      - name: Configure OpenSSL for Android headers
        run: |
          set -e

          NDK_VERSION=${{ steps.ndk_ver.outputs.ndk_version }}
          NDK_ROOT="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"

          # Set up environment for OpenSSL cross-compilation
          export ANDROID_NDK_ROOT="${NDK_ROOT}"
          export ANDROID_NDK="${NDK_ROOT}"
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export PATH="${TOOLCHAIN}/bin:${PATH}"

          # Navigate to OpenSSL source
          cd tdlib/source/openssl || exit 1

          echo "========== OpenSSL Configuration =========="
          echo "NDK_ROOT: ${NDK_ROOT}"
          echo "TOOLCHAIN: ${TOOLCHAIN}"
          echo "ANDROID_NDK_ROOT: ${ANDROID_NDK_ROOT}"
          echo "PATH (first 3): $(echo $PATH | cut -d: -f1-3)"
          echo "OpenSSL version: $(./Configure --version 2>&1 | head -1)"
          echo ""

          # Verify toolchain before configuring
          if ! command -v aarch64-linux-android-gcc &> /dev/null; then
            echo "ERROR: aarch64-linux-android-gcc not found in PATH"
            echo "PATH is: $PATH"
            exit 1
          fi
          echo "✓ aarch64-linux-android-gcc found: $(which aarch64-linux-android-gcc)"
          echo ""

          # Configure OpenSSL for Android arm64 (aarch64)
          # Options:
          #   android-arm64: configure for Android ARM64 (aarch64)
          #   no-shared: build static libraries (used by TDLib)
          #   -D__ANDROID_API__=21: target Android API 21+
          echo "Running: ./Configure android-arm64 no-shared -D__ANDROID_API__=21 ..."
          ./Configure android-arm64 no-shared -D__ANDROID_API__=21 || {
            echo "Configure failed. Checking OpenSSL configure output..."
            exit 1
          }

          # Generate dependencies (header files, include paths, etc.)
          echo "Running: make depend ..."
          make depend || {
            echo "Make depend failed."
            exit 1
          }

          echo "========== OpenSSL Configuration Complete =========="
          echo "Generated headers:"
          ls -lh include/openssl/opensslv.h 2>/dev/null || echo "Warning: opensslv.h not found yet (will be generated during Gradle build)"

          echo "Makefile generated:"
          ls -lh Makefile 2>/dev/null || echo "Warning: Makefile not found"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache native build outputs
        uses: actions/cache@v4
        with:
          path: |
            app/jni/.cxx
            app/build/intermediates/cmake
          key: native-${{ runner.os }}-${{ hashFiles('app/jni/**', 'version.properties') }}
          restore-keys: native-${{ runner.os }}-

      - name: Decode signing keystore
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS:      ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD:   ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > keystore.jks

          cat > keystore-config.properties <<EOF
          keystore.file=$(pwd)/keystore.jks
          keystore.password=${SIGNING_STORE_PASSWORD}
          key.alias=${SIGNING_KEY_ALIAS}
          key.password=${SIGNING_KEY_PASSWORD}
          EOF

          echo "KEYSTORE_CONFIG_PATH=$(pwd)/keystore-config.properties" >> "$GITHUB_ENV"

      - name: Write local.properties
        env:
          TELEGRAM_API_ID:   ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          APP_ID:            ${{ secrets.APP_ID }}
          APP_NAME:          ${{ secrets.APP_NAME }}
          APP_DOWNLOAD_URL:  ${{ secrets.APP_DOWNLOAD_URL }}
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          telegram.api_id=${TELEGRAM_API_ID:-0}
          telegram.api_hash=${TELEGRAM_API_HASH:-}
          app.id=${APP_ID:-com.itszoney}
          app.name=${APP_NAME:-Zoneygram}
          app.download_url=${APP_DOWNLOAD_URL:-https://telegram.org/dlx}
          EOF

          if [ -n "$KEYSTORE_CONFIG_PATH" ]; then
            echo "keystore.file=$KEYSTORE_CONFIG_PATH" >> local.properties
          else
            echo "app.disable_signing=true" >> local.properties
          fi

      - name: Build release APK (all ABIs)
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        id: collect_apks
        run: |
          mkdir -p dist
          find app/build/outputs/apk/*/release/ -name "*.apk" -exec cp {} dist/ \;
          ls -lh dist/
          echo "apk_count=$(ls dist/*.apk | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ github.sha }}
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: >
          startsWith(github.ref, 'refs/tags/v') ||
          github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.ref_name }}
          name:       Release ${{ github.ref_name }}
          draft:      false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            ## Zoneygram – ${{ github.ref_name }}

            ### What changed
            See the [full commit history](${{ github.server_url }}/${{ github.repository }}/commits/${{ github.sha }})
            for all changes in this release.

            ### Volume improvements
            - Separate **Volume Boost** slider (100 %–500 %) in sound settings.
            - Boost works in 1-on-1 calls, group calls and channel calls.
            - Signal Gain, Bass, and Treble controls preserved.

            ### Downloads
            Install the APK that matches your device ABI:
            | ABI | File |
            |-----|------|
            | arm64-v8a  (most modern phones) | `*-arm64-v8a*.apk`  |
            | armeabi-v7a (older/32-bit)      | `*-armeabi-v7a*.apk`|
            | x86_64 (emulators)              | `*-x86_64*.apk`     |
          files: dist/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
